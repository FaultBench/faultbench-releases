<!--
  "Runs with no signal" pill for the README header.

  Navy on both themes deliberately: the previous version filled white, which
  vanished into GitHub's light background and glared on the dark one. A single
  dark pill reads correctly on either, so there is no light/dark pair to keep
  in step.

  The label is centred rather than left-anchored so that a viewer without the
  preferred font grows the text from the middle instead of overflowing the
  right edge of the pill.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="268" height="40" viewBox="0 0 268 40"
     role="img" aria-label="Runs with no signal. Nothing leaves your device.">
  <title>Runs with no signal — nothing leaves your device</title>

  <rect width="268" height="40" rx="20" fill="#122442"/>
  <rect x="1" y="1" width="266" height="38" rx="19" fill="none" stroke="#0061FD" stroke-width="2" opacity="0.55"/>

  <g transform="translate(4 0)">
    <g stroke="#4D93FF" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M20 24a10 10 0 0 1 20 0"/>
      <path d="M25 20a5 5 0 0 1 10 0"/>
    </g>
    <circle cx="30" cy="27" r="2.6" fill="#4D93FF"/>
    <line x1="17" y1="30" x2="43" y2="12" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <text x="157" y="26" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" letter-spacing="0.2" fill="#FFFFFF">Runs with no signal</text>
</svg>
